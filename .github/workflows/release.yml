name: Release

# Push a tag (git tag v1.0.0 && git push origin v1.0.0) to build the
# self-contained app and publish it as a GitHub Release. The bundle is
# ad-hoc signed (no Apple Developer ID), so it is not notarized: users clear
# the quarantine flag once after downloading (README, "Install"). Installed
# apps then update themselves from the appcast (the last step).
#
# A tag with a suffix (v1.1.0-beta.1, v1.1.0-rc.1) publishes a pre-release
# instead: it can point at a feature branch's commit, and the latest release
# stays the one users get (it is never marked Latest).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, upload assets, push the appcast

# One release at a time: each one commits to the appcast branch.
concurrency:
  group: release
  cancel-in-progress: false

env:
  QT_VERSION: "6.12.0"
  AQT_VERSION: "==3.3.*"

jobs:
  agents:
    uses: ./.github/workflows/remote-agents.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Build and publish (macOS arm64)
    needs: agents
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe --tags for the display version
          submodules: recursive # external/rask, KSyntaxHighlighting

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          # The WebP plugin: macOS's BusyIndicator is an animated .webp.
          modules: qtimageformats
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Install tools
        run: brew install ninja

      # The Linux hosts' agents, bundled beside this Mac's (KODE_REMOTE_AGENTS_DIR).
      - uses: actions/download-artifact@v4
        with:
          pattern: kode-remote-linux-*
          path: ${{ runner.temp }}/agents
          merge-multiple: true
      - run: chmod +x "$RUNNER_TEMP"/agents/*/kode-remote

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DKODE_REMOTE_AGENTS_DIR="$RUNNER_TEMP/agents"

      - name: Build
        run: cmake --build build/release

      - name: Test
        run: ctest --test-dir build/release --output-on-failure

      - name: Package (ad-hoc signed)
        run: |
          cmake --build build/release --target package-macos
          APP=build/release/dist/Kode.app
          # The install step deploys Qt into the bundle, prunes what Kode
          # never loads and signs it ad hoc (cmake/PruneBundle.cmake).
          codesign --verify --deep --strict --verbose=2 "$APP"

          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/Kode-$VERSION-arm64.zip"

          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Kode -srcfolder "$STAGE" -ov -format UDZO \
            "out/Kode-$VERSION-arm64.dmg"

          (cd out && shasum -a 256 Kode-* > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # docs/releases/<tag>.md, when present, opens the notes.
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" "$RUNNER_TEMP/notes.md"; else : > "$RUNNER_TEMP/notes.md"; fi
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ## Install

          Open the `.dmg` and drag **Kode** to **Applications**. Kode is not
          notarized by Apple, so clear the quarantine flag once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Kode.app
          ```

          Or open it, then allow it in **System Settings → Privacy & Security →
          Open Anyway**. Requires macOS 14.4+ on Apple Silicon.
          EOF
          # A stable release lists the changes since the previous stable one,
          # not since a pre-release in between.
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | grep -vxF "$GITHUB_REF_NAME" | head -n 1 || true)
          FLAGS=(--latest)
          if [ -n "$PREVIOUS" ]; then FLAGS+=(--notes-start-tag "$PREVIOUS"); fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS=(--prerelease --latest=false)
            {
              echo
              echo "> **Pre-release** built from \`${GITHUB_SHA::7}\` for testing; the latest"
              echo "> release remains the stable version."
            } >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" out/* "${FLAGS[@]}" \
            --title "Kode ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Publish the update (Sparkle appcast)
        # "Check for Updates…" reads appcast.xml on the appcast branch. The
        # zip is signed with the EdDSA key whose public half is in the app
        # (KODE_UPDATE_PUBLIC_KEY); a pre-release goes in the beta channel.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: the appcast was not updated."
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          ZIP="out/Kode-$VERSION-arm64.zip"
          PLIST=build/release/dist/Kode.app/Contents/Info.plist
          if ! plutil -extract SUPublicEDKey raw "$PLIST" >/dev/null 2>&1; then
            echo "::error::The app has no SUPublicEDKey (KODE_UPDATE_PUBLIC_KEY): it could not install this update."
            exit 1
          fi
          BUILD=$(plutil -extract CFBundleVersion raw "$PLIST")
          SIGN_UPDATE=$(find build/release -path '*sparkle*' -name sign_update -type f | head -n 1)
          SIGNATURE=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "$ZIP")
          CHANNEL=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then CHANNEL=(--channel beta); fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FEED="$RUNNER_TEMP/appcast"
          if git fetch origin appcast; then
            git worktree add -B appcast "$FEED" FETCH_HEAD
          else
            git worktree add --orphan -b appcast "$FEED"
          fi
          python3 -I tools/update-appcast.py "$FEED/appcast.xml" \
            --version "$VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Kode-$VERSION-arm64.zip" \
            --length "$(stat -f %z "$ZIP")" --signature "$SIGNATURE" \
            --notes "docs/releases/$GITHUB_REF_NAME.md" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            "${CHANNEL[@]}"
          git -C "$FEED" add appcast.xml
          git -C "$FEED" commit -m "Kode $VERSION"
          git -C "$FEED" push origin appcast
