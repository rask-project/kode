name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_VERSION: "6.12.0"
  AQT_VERSION: "==3.3.*"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        # As CMakeLists.txt: the last tag, without its "v".
        run: echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"

  agents:
    needs: version
    uses: ./.github/workflows/remote-agents.yml
    with:
      version: ${{ needs.version.outputs.version }}

  format:
    name: Check formatting
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt (qmlformat)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true
      - run: pipx install clang-format==19.1.6
      - run: QMLFORMAT="$QT_ROOT_DIR/bin/qmlformat" tools/format-code.sh --check

  macos:
    name: macOS (arm64)
    needs: agents
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe --tags for the version
          submodules: recursive # external/rask

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Install tools
        run: brew install ninja

      # The Linux hosts' agents, bundled beside this Mac's.
      - uses: actions/download-artifact@v4
        with:
          pattern: kode-remote-linux-*
          path: ${{ runner.temp }}/agents
          merge-multiple: true
      - run: chmod +x "$RUNNER_TEMP"/agents/*/kode-remote

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DKODE_REMOTE_AGENTS_DIR="$RUNNER_TEMP/agents"

      - name: Build
        run: cmake --build build/ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

      # The self-contained app, to try a branch's build (ad hoc signed).
      - name: Package
        run: |
          cmake --build build/ci --target package-macos
          codesign --verify --deep --strict build/ci/dist/Kode.app
          ditto -c -k --sequesterRsrc --keepParent build/ci/dist/Kode.app "$RUNNER_TEMP/Kode.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Kode-${{ github.sha }}
          path: ${{ runner.temp }}/Kode.zip
          if-no-files-found: error
