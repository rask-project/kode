name: Site

# Builds site/ with Jekyll and publishes it to GitHub Pages
# (https://rask-project.github.io/kode/). The screenshots and icons come
# from docs/images and assets/ (tools/site-assets.sh).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "assets/settings/**"
      - "assets/kode.png"
      - "tools/site-assets.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copy the screenshots and icons
        run: tools/site-assets.sh
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
